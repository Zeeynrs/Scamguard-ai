services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - hf-cache:/root/.cache/huggingface
    # Host has 3.82 GiB RAM and NO swap. Observed high-water under 8 concurrent
    # live-call sessions is ~1.6 GiB. Without a limit a runaway session can OOM
    # the whole host and kill every container; 2g converts that into a single
    # container restart. See STRESS_TEST.md §7.
    deploy:
      resources:
        limits:
          memory: 2g
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamguard-bot
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$BOT_WEBHOOK_URL" ]; then
        echo "BOT_WEBHOOK_URL is set; webhook mode active — idling to avoid polling conflict";
        exec sleep infinity;
      else
        exec python -m app.bot;
      fi'
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - hf-cache:/root/.cache/huggingface
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: scamguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf-cache:
